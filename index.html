<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brushify</title>
    <link rel="stylesheet" href="hii.css">
</head>
<body>
    <center>
        <h1>Brushify</h1>
        <div id="box"contenteditable="true"></div>
        <br><br>
        <button id="dwd">Download</button>
        <br><br><br><br>
        <div id="second">
         <div id="bgcolor" style="border:1px solid black;height: 200px;
    width: 400px;">
                <h2>Choose your background color</h2>
                <button onclick="changeBackgroundColor('red')" style="background-color:red;"></button>
                <button onclick="changeBackgroundColor('green')" style="background-color:green;"></button>
                <button onclick="changeBackgroundColor('blue')" style="background-color:blue;"></button>
                <button onclick="changeBackgroundColor('black')" style="background-color:black;"></button>
                <button onclick="changeBackgroundColor('gray')" style="background-color:gray;"></button>
                <button onclick="changeBackgroundColor('white')" style="background-color:white;"></button>
                <button onclick="changeBackgroundColor('yellow')" style="background-color:yellow;"></button>
                <button onclick="changeBackgroundColor('purple')" style="background-color:purple;"></button>
                <button onclick="changeBackgroundColor('pink')" style="background-color:pink;"></button>
                <button onclick="changeBackgroundColor('orange')" style="background-color:orange;"></button>
               
            </div>
            <div id="text-color" style="border:1px solid black;height: 200px;
    width: 400px;">
                <h2>Choose your text color</h2>
                <button onclick="changeTextColor('red')" style="background-color:red;"></button>
                <button onclick="changeTextColor('green')" style="background-color:green;"></button>
                <button onclick="changeTextColor('black')" style="background-color:black;"></button>
                <button onclick="changeTextColor('gray')" style="background-color:gray;"></button>
                <button onclick="changeTextColor('white')" style="background-color:white;"></button>
                <button onclick="changeTextColor('blue')" style="background-color:blue;"></button>
                <button onclick="changeTextColor('yellow')" style="background-color:yellow;"></button>
                <button onclick="changeTextColor('purple')" style="background-color:purple;"></button>
                <button onclick="changeTextColor('pink')" style="background-color:pink;"></button>
                <button onclick="changeTextColor('orange')" style="background-color:orange;"></button>
            </div>
            <div id="fonts" style="border:1px solid black;height: 200px;
    width: 400px;">
                <h2>Choose your font style</h2>
                <button onclick="changefontfamily('cursive')">Cursive</button>
                <button onclick="changefontfamily('serif')">Serif</button>
                <button onclick="changefontfamily('sans-serif')">Sans</button>
                <button onclick="changefontfamily('tahoma')">tahoma</button>
                <button onclick="changefontfamily('georgia')">georgia</button>
            </div>
        </div>
    </center>
   <script>
        function changeBackgroundColor(color) {
            document.getElementById("box").style.backgroundColor=color;
        }
        function changeTextColor(color) {
            document.getElementById("box").style.color=color;
        }
        function changefontfamily(font) {
            document.getElementById("box").style.fontFamily=font;
        }
    </script>
</body>
</html>
